buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // AGP 9 ships built-in Kotlin and pulls in KGP 2.2.10 by default.
        // Pin the current stable Kotlin Gradle plugin on top of it, as the
        // AGP 9.0 release notes ("Upgrade to a higher KGP version") describe.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    id 'com.android.application' version '9.5.3' apply false
    id 'com.google.gms.google-services' version '4.6.0' apply false
}
