name: upgrade-smoke
on:
  workflow_dispatch:

jobs:
  upgrade-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live 1.8 and the signed 1.9 candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sL -o HomeRoom-1.8.apk https://github.com/${{ github.repository }}/releases/download/v1.8/HomeRoom-1.8.apk
          curl -sL -o SHA256SUMS-1.8.txt https://github.com/${{ github.repository }}/releases/download/v1.8/SHA256SUMS.txt
          grep HomeRoom-1.8.apk SHA256SUMS-1.8.txt | sha256sum -c -
          RID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" | python3 -c "import json,sys;print([r['id'] for r in json.load(sys.stdin) if r['tag_name']=='v1.9'][0])")
          AID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$RID" | python3 -c "import json,sys;print([a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='HomeRoom-1.9.apk'][0])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o HomeRoom-1.9.apk "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID"
          echo "6b49fb47d359a3eb2e6cd73537cd86f48cbbf2d142b201592c92f58904460588  HomeRoom-1.9.apk" | sha256sum -c -

      - name: Enable KVM (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Install-over upgrade smoke on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          script: |
            set -e
            while [ "$(adb shell service check package 2>/dev/null | tr -d '\r')" != "Service package: found" ]; do sleep 5; done
            adb shell settings put global verifier_verify_adb_installs 0
            uix() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1; }
            find_tap() {
              for i in 1 2 3 4 5; do
                uix
                B=$(python3 - "$1" <<'EOF'
            import re,sys
            d=open('/tmp/ui.xml').read()
            for m in re.finditer(r'content-desc="([^"]*)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',d):
                if m.group(1).startswith(sys.argv[1]):
                    print((int(m.group(2))+int(m.group(4)))//2,(int(m.group(3))+int(m.group(5)))//2);break
            EOF
            )
                if [ -n "$B" ]; then adb shell input tap $B; return 0; fi
                adb shell input swipe 540 1600 540 700; sleep 3
              done
              return 1
            }
            checked_of() {
              uix
              python3 - "$1" <<'EOF'
            import re,sys
            d=open('/tmp/ui.xml').read()
            for m in re.finditer(r'content-desc="([^"]*)"[^>]*checked="(true|false)"',d):
                if m.group(1).startswith(sys.argv[1]): print(m.group(2));break
            EOF
            }
            echo '== install live 1.8'
            adb install HomeRoom-1.8.apk
            adb shell pm grant app.homeroom android.permission.POST_NOTIFICATIONS || true
            FIRST18=$(adb shell dumpsys package app.homeroom | grep -i firstInstallTime | head -1)
            echo "1.8 $FIRST18"
            echo '== launch 1.8, seed: turn Vibrate on press OFF'
            adb shell am start -n app.homeroom/.MainActivity
            sleep 25
            adb shell input keyevent KEYCODE_WAKEUP; adb shell input keyevent 82; sleep 5
            find_tap "Settings" || { echo 'Settings tab not found in 1.8'; exit 1; }
            sleep 5
            S18=$(checked_of "Vibrate on press"); echo "1.8 vibrate=$S18"
            [ "$S18" = "true" ] || { echo "expected default ON in 1.8, got '$S18'"; exit 1; }
            find_tap "Vibrate on press" || { echo 'toggle not found in 1.8'; exit 1; }
            sleep 3
            S18B=$(checked_of "Vibrate on press"); echo "1.8 vibrate after tap=$S18B"
            [ "$S18B" = "false" ] || { echo 'toggle did not turn OFF in 1.8'; exit 1; }
            echo '== install-over signed 1.9'
            adb install -r HomeRoom-1.9.apk | tee install19.txt
            grep -q Success install19.txt || { echo 'INSTALL-OVER FAILED'; exit 1; }
            adb shell pm grant app.homeroom android.permission.POST_NOTIFICATIONS || true
            FIRST19=$(adb shell dumpsys package app.homeroom | grep -i firstInstallTime | head -1)
            VC=$(adb shell dumpsys package app.homeroom | grep -i 'versionCode=14' | head -1)
            echo "1.9 $FIRST19"; echo "$VC"
            [ "$FIRST18" = "$FIRST19" ] || { echo 'firstInstallTime CHANGED - data wipe suspected'; exit 1; }
            [ -n "$VC" ] || { echo 'versionCode 14 not on device'; exit 1; }
            echo '== launch 1.9, verify retained setting + clean start'
            adb shell am start -n app.homeroom/.MainActivity
            sleep 45
            adb shell input keyevent KEYCODE_WAKEUP; adb shell input keyevent 82; sleep 10
            for i in 1 2 3; do adb shell pidof app.homeroom && break; sleep 15; done
            adb shell pidof app.homeroom || { echo 'process not alive'; adb logcat -d | tail -60; exit 1; }
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*app.homeroom'
            find_tap "Settings" || { echo 'Settings tab not found in 1.9'; exit 1; }
            sleep 5
            S19=$(checked_of "Vibrate on press"); echo "1.9 vibrate=$S19"
            [ "$S19" = "false" ] || { echo "RETENTION FAILED: expected OFF after upgrade, got '$S19'"; exit 1; }
            adb shell screencap -p /data/local/tmp/upgrade-smoke.png
            adb pull /data/local/tmp/upgrade-smoke.png upgrade-smoke.png
            echo 'ok: live 1.8 -> signed 1.9 install-over accepted, firstInstallTime retained, setting retained, launch clean'

      - name: Upload upgrade smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-smoke-screenshot
          path: upgrade-smoke.png
          if-no-files-found: ignore
