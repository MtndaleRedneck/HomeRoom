      - name: Assert the stub saw the expected synthetic flow
        run: |
          ls -la stub-log.jsonl
          wc -l stub-log.jsonl
          # Anchored to the logged "path" field with the app's /homeroom/v1 prefix, so the
          # unprefixed readiness probe (curl GET /owner/instance) cannot satisfy these.
          for pat in '"method": "GET", "path": "/homeroom/v1/owner/instance"' '"path": "/homeroom/v1/owner/rooms/stub-room/events[?"]' '"method": "POST", "path": "/homeroom/v1/owner/decisions/stub-decision/prepare-answer"' '"method": "POST", "path": "/homeroom/v1/owner/decisions/stub-decision/confirm-answer"' '"method": "GET", "path": "/homeroom/v1/owner/ais"' '"method": "POST", "path": "/homeroom/v1/owner/rooms/stub-room/ask-all"' '"method": "GET", "path": "/homeroom/v1/owner/requests/stub-ask-1"' '"method": "GET", "path": "/homeroom/v1/owner/events/stub-ev-ask-reply"'; do
            grep -q "$pat" stub-log.jsonl || { echo "STUB LOG MISSING PATTERN: $pat"; tail -20 stub-log.jsonl; exit 1; }
          done
          PRE=$(grep -n '"method": "POST", "path": "/homeroom/v1/owner/decisions/stub-decision/prepare-answer"' stub-log.jsonl | head -1 | cut -d: -f1)
          CON=$(grep -n '"method": "POST", "path": "/homeroom/v1/owner/decisions/stub-decision/confirm-answer"' stub-log.jsonl | head -1 | cut -d: -f1)
          [ -n "$PRE" ] && [ -n "$CON" ] && [ "$PRE" -lt "$CON" ] || { echo "STUB LOG ORDER VIOLATION: prepare line ${PRE:-none} not before confirm line ${CON:-none}"; exit 1; }
          echo "ok: stub log shows APP instance GET + room events + decision POST prepare before POST confirm + ask-all POST and answers/reply GETs (method+path presence and order only; SYNTHETIC flow)"

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-interaction-evidence
          path: |
            i-*.png
            stub-log.jsonl
            logcat-full.txt
            ui-dump-*.xml
          if-no-files-found: warn
          retention-days: 7
