            XY=$(python3 ci/ui-tap.py "Needs you") || { adb shell input swipe 540 1800 540 600 600; sleep 2; XY=$(python3 ci/ui-tap.py "Needs you"); }; [ -n "$XY" ] && adb shell input tap $XY
            sleep 5
