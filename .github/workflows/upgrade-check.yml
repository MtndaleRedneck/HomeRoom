name: upgrade-check
on:
  push:
    branches: [ci/upgrade-check-1.5]
jobs:
  upgrade-1.4-to-1.5:
    # Finite upgrade evidence: published v1.4 APK -> adb install -r the
    # signed 1.5 release candidate from ci-inputs/ -> launch. Proves the
    # upgrade path (signature continuity, package identity and app data
    # retained across the update), which the fresh-install signed lane
    # does not cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published v1.4 APK
        run: curl -fL -o v1.4.apk https://github.com/MtndaleRedneck/HomeRoom/releases/download/v1.4/HomeRoom.apk

      - name: Verify both APKs carry the mandatory signer cert
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs v1.4.apk | tee v14-certs.txt
          "$BT/apksigner" verify --print-certs ci-inputs/homeroom-1.5-reconstruction-REVIEW-ONLY-NOT-A-RELEASE.apk | tee v15-certs.txt
          grep -qi '0063cd1617c138f6ab8a2b58420f0d72fbfeac6d8b176bc77463e7c8eca932e6' v14-certs.txt
          grep -qi '0063cd1617c138f6ab8a2b58420f0d72fbfeac6d8b176bc77463e7c8eca932e6' v15-certs.txt
          sha256sum v1.4.apk ci-inputs/homeroom-1.5-reconstruction-REVIEW-ONLY-NOT-A-RELEASE.apk | tee apk-sha256.txt

      - name: Enable KVM (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Install v1.4, upgrade in place to signed 1.5, verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          script: |
            while [ "$(adb shell service check package 2>/dev/null | tr -d '\r')" != "Service package: found" ]; do sleep 5; done
            adb shell settings put global verifier_verify_adb_installs 0
            adb install v1.4.apk
            adb shell monkey -p app.homeroom -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof app.homeroom
            adb shell dumpsys package app.homeroom | grep -E 'firstInstallTime|lastUpdateTime|versionCode|versionName' | tee before-upgrade.txt
            adb install -r ci-inputs/homeroom-1.5-reconstruction-REVIEW-ONLY-NOT-A-RELEASE.apk
            adb shell dumpsys package app.homeroom | grep -E 'firstInstallTime|lastUpdateTime|versionCode|versionName' | tee after-upgrade.txt
            FIRST_BEFORE=$(grep firstInstallTime before-upgrade.txt)
            FIRST_AFTER=$(grep firstInstallTime after-upgrade.txt)
            [ "$FIRST_BEFORE" = "$FIRST_AFTER" ] || { echo 'FAIL: firstInstallTime changed across upgrade - package identity/data NOT retained'; exit 1; }
            grep -q 'versionCode=8' before-upgrade.txt || { echo 'FAIL: v1.4 baseline versionCode not 8'; cat before-upgrade.txt; exit 1; }
            grep -q 'versionCode=10' after-upgrade.txt || { echo 'FAIL: post-upgrade versionCode not 10'; cat after-upgrade.txt; exit 1; }
            adb shell monkey -p app.homeroom -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent 82
            sleep 15
            for i in 1 2 3; do adb shell pidof app.homeroom && break; echo "pidof attempt $i: process not up yet"; sleep 15; done
            adb shell pidof app.homeroom || { echo 'process not alive after upgrade - dumping app-focused logcat'; adb logcat -d | grep -iE 'app\.homeroom|AndroidRuntime|FATAL EXCEPTION|am_crash' | tail -80; exit 1; }
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*app.homeroom'
            adb shell screencap -p /data/local/tmp/post-upgrade.png
            adb pull /data/local/tmp/post-upgrade.png post-upgrade.png
            echo 'ok: v1.4 -> signed 1.5 in-place upgrade keeps firstInstallTime (identity/data retained), versionCode 8 -> 10, app launches post-upgrade, no fatal exception'

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-check-evidence
          path: |
            before-upgrade.txt
            after-upgrade.txt
            v14-certs.txt
            v15-certs.txt
            apk-sha256.txt
            post-upgrade.png
          if-no-files-found: warn
          retention-days: 5
